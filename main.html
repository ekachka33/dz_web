<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css"> <!-- Подключение Bootstrap Icons -->
    <title>Главная</title>
    <style>
        .sidebar {
            background-color: #DFDBE5; /* Фоновый цвет */
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%239C92AC' fill-opacity='0.4' fill-rule='evenodd'/%3E%3C/svg%3E");
            background-size: 80px 80px; /* Размер узора */
            padding: 20px;
            height: 100vh; /* Высота боковой колонки */
            width: 250px; /* Уменьшенная ширина боковой колонки */
            display: flex;
            flex-direction: column;
        }
        .user-section {
            margin-top: auto; /* Переместить пользователя вниз */
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .user-section button {
            margin-left: 10px; /* Отступ для кнопки */
            font-size: 12px; /* Уменьшенный размер кнопки */
        }
        .profile-menu {
            display: none; /* Скрыть меню по умолчанию */
            margin-top: 10px; /* Отступ сверху для меню */
        }
        .submenu {
            display: block; /* Сделать подменю всегда открытым */
            margin-top: 10px; /* Отступ сверху для подменю */
        }
        .btn-pink {
            background-color: #FF69B4; /* Розовый цвет кнопки */
            color: white; /* Цвет текста кнопки */
        }
        .product-header {
            background-color: #e9ecef; /* Серый фон для заголовка блока товара */
            padding: 10px;
            border-radius: 10px 10px 0 0; /* Округленные верхние углы */
        }
        .price {
            font-size: 24px; /* Размер шрифта для цены */
            text-align: center; /* Центрирование текста */
        }
        .icon-black {
            color: black; /* Черный цвет значков */
        }
    </style>
</head>
<body>
    <div class="d-flex">
        <!-- Боковая колонка -->
        <div class="sidebar">
            <h2>Меню</h2>
            <div class="submenu" id="submenu">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="index.html"><i class="fas fa-home icon-black"></i> Главная</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="category.html"><i class="fas fa-image icon-black"></i> Критерии</a> <!-- Ссылка на category.html -->
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="orders.html"><i class="fas fa-shopping-cart icon-black"></i> Заказы</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="contacts.html"><i class="fas fa-address-book icon-black"></i> Контакты</a>
                    </li>
                </ul>
            </div>
            <div class="user-section">
                <div>
                    <i class="fas fa-user-circle icon-black" style="font-size: 50px;"></i>
                    <span>Пользователь</span>
                </div>
                <button class="btn btn-link" onclick="toggleMenu()"><i class="fas fa-caret-down icon-black"></i></button>
            </div>
            <div class="profile-menu" id="profileMenu">
                <button class="btn btn-link text-white">Профиль</button>
                <button class="btn btn-link text-white">Выход</button>
            </div>
        </div>

        <!-- Основная часть -->
        <div class="container">
            <h1 class="mt-4 text-center">Главная</h1>
            <p class="text-center text-muted">Вы находитесь на странице, предназначенной для продажи товаров.</p>
            <div class="row">
                <div class="col-md-4">
                    <div class="card mb-4">
                        <div class="product-header">
                            <h5 class="card-title text-center">Товар 1</h5>
                        </div>
                        <div class="card-body text-center">
                            <p class="card-text">Описание товара 1</p>
                            <div class="price"><i class="fas fa-dollar-sign icon-black"></i> 100</div> <!-- Значок доллара -->
                            <a href="javascript:void(0);" class="btn btn-pink" onclick="addToCart('Товар 1')">Купить</a> <!-- Розовая кнопка для Товара 1 -->
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card mb-4">
                        <div class="product-header">
                            <h5 class="card-title text-center">Товар 2</h5>
                        </div>
                        <div class="card-body text-center">
                            <p class="card-text">Описание товара 2</p>
                            <div class="price"><i class="fas fa-dollar-sign icon-black"></i> 200</div> <!-- Значок доллара -->
                            <a href="javascript:void(0);" class="btn btn-pink" onclick="addToCart('Товар 2')">Купить</a> <!-- Розовая кнопка для Товара 2 -->
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card mb-4">
                        <div class="product-header">
                            <h5 class="card-title text-center">Товар 3</h5>
                        </div>
                        <div class="card-body text-center">
                            <p class="card-text">Описание товара 3</p>
                            <div class="price"><i class="fas fa-dollar-sign icon-black"></i> 300</div> <!-- Значок доллара -->
                            <a href="javascript:void(0);" class="btn btn-pink" onclick="addToCart('Товар 3')">Купить</a> <!-- Розовая кнопка для Товара 3 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Функция для добавления товара в корзину
        function addToCart(item) {
            localStorage.setItem('cartItem', item); // Сохраняем товар в localStorage
            alert(item + " добавлен в корзину.");
            window.location.href = 'orders.html'; // Перенаправляем на страницу заказов
        }

        // Функция для переключения меню профиля
        function toggleMenu() {
            const menu = document.getElementById('profileMenu');
            menu.style.display = menu.style.display === 'none' || menu.style.display === '' ? 'block' : 'none';
        }
    </script>
</body>
</html>
